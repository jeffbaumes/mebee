name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be switched on, with its source set to "GitHub
      # Actions", before this runs. configure-pages has an `enablement: true`
      # option that is supposed to do that automatically, but the workflow's
      # GITHUB_TOKEN is not permitted to create a Pages site -- it fails with
      # "Create Pages site failed: Resource not accessible by integration"
      # regardless of the `pages: write` permission below. Enabling Pages is a
      # one-time manual step; see README.
      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src docs _site/
          # Skip Jekyll entirely: it is not needed for a static bundle and it
          # silently drops paths it considers special.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
