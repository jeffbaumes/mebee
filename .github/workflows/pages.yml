name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on using this workflow's own token, so the
      # site can go live without anyone touching repository settings by hand.
      # It still requires Pages to be available for the repo, which on a free
      # plan means the repo must be public.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src docs _site/
          # Skip Jekyll entirely: it is not needed for a static bundle and it
          # silently drops paths it considers special.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
